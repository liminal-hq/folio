[package]
name = "folio"
version = "0.1.0"
description = "A local-first book layout app"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# Published reusable plugins: registry dependencies, never copies (decision D-08).
tauri-plugin-system-appearance = "0.1"
tauri-plugin-window-manager = "0.1"
folio-protocol = { path = "../../../crates/folio-protocol" }
folio-mcp = { path = "../../../crates/folio-mcp", default-features = false }
folio-settings = { path = "../../../crates/folio-settings" }
tauri-plugin-folio-books = { path = "../../../plugins/folio-books" }
tauri-plugin-folio-settings = { path = "../../../plugins/folio-settings" }
serde_json = { workspace = true }
log = { workspace = true }
chrono = "0.4"
tauri-plugin-updater = "2"

[dev-dependencies]
folio-presets = { path = "../../../crates/folio-presets" }
tauri = { workspace = true, features = ["test"] }
tempfile = "3"

# Debug-only automation bridge, registered under `#[cfg(all(debug_assertions, not(windows)))]` in
# `src/lib.rs`. It must be a normal dependency (dev-dependencies are not available to the lib
# target) even though release builds never activate it. It is left out on Windows: 0.13.0 depends on
# `webview2-com` 0.38 while Tauri 2.12 uses 0.39, so the two do not compile together there. Drop the
# `cfg` once a bridge release matches Tauri's `windows` crate.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-mcp-bridge = "0.13"

# The main thread must be a single-threaded COM apartment before anything else touches COM, or
# the window library cannot set up native drag and drop (see `src/com.rs`). Matches the version
# Tauri resolves, so the types line up.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Ole"] }
