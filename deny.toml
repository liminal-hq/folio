# Licence policy for every crate Folio depends on (D-25).
#
# Folio is `Apache-2.0 OR MIT`. Everything linked in must be under a permissive licence, apart from
# MPL-2.0 below, so a new dependency under any other copyleft licence fails the check and has to be
# looked at by a person.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  # MPL-2.0 is file-level copyleft: fine when a crate is used unmodified, which these all are.
  # Folio's own use is `spellbook` (the spell checker); Tauri's web stack brings `cssparser`,
  # `selectors`, `dtoa-short` and `option-ext`. Each is listed in the third-party notices.
  "MPL-2.0",
]
