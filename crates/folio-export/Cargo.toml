[package]
name = "folio-export"
version = "0.1.0"
description = "Folio's exporters: PDF and EPUB from the page scene. Pure Rust, no Tauri"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
folio-colour = { path = "../folio-colour" }
folio-layout = { path = "../folio-layout" }
folio-model = { path = "../folio-model" }
krilla = "0.8"
thiserror = { workspace = true }
kurbo = "0.11"
lopdf = "0.34"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-segmentation = "1"

[dev-dependencies]
folio-presets = { path = "../folio-presets" }
quick-xml = "0.37"
