[package]
name = "folio-model"
version = "0.1.0"
description = "The Folio document model: units, identifiers and book kinds. The model is the source of truth and lives in Rust"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
# Derives JSON Schema for the types an agent sends (used by `folio-mcp`).
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
