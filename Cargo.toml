[workspace]
members = [
  "crates/folio-model",
  "crates/folio-layout",
  "crates/folio-package",
  "crates/folio-presets",
  "crates/folio-protocol",
  "crates/folio-session",
  "crates/folio-settings",
  "apps/folio/src-tauri",
  "crates/wayland-toplevel-drag",
  "plugins/folio-books",
  "plugins/folio-settings",
  "plugins/window-effects",
  "plugins/window-tearoff",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
rust-version = "1.93.0"
homepage = "https://github.com/liminal-hq/folio"
repository = "https://github.com/liminal-hq/folio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
ts-rs = "12"
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin = { version = "2" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
log = "0.4"

[profile.release]
strip = true
