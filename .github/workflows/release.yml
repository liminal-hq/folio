name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag, for example v0.1.0
        required: false
        type: string
      release_draft:
        description: Create or keep the GitHub Release as a draft
        required: false
        default: false
        type: boolean
      release_prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
      dry_run:
        description: Build and stage artefacts without changing a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_TAG}" ]]; then
            tag="${MANUAL_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(bash scripts/check-release-versions.sh --current-version)"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git fetch origin main --tags
          dry_run=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then dry_run=true; fi
          if [[ "${dry_run}" == true ]]; then target="${GITHUB_SHA}"; else target="$(git rev-list -n 1 "${tag}")"; fi
          git merge-base --is-ancestor "${target}" origin/main
          git checkout --quiet "${target}"
          version="$(bash scripts/check-release-versions.sh --current-version)"
          [[ "v${version}" == "${tag}" ]]
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          draft=false
          prerelease=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.release_draft }}" == "true" ]]; then draft=true; fi
          # A prerelease tag always stays a prerelease; the manual flag can also opt a normal tag in.
          if [[ "${tag}" == *-* ]] || [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.release_prerelease }}" == "true" ]]; then prerelease=true; fi
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${dry_run}" >> "${GITHUB_OUTPUT}"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DRAFT: ${{ steps.release.outputs.draft }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "${DRY_RUN}" == true ]] && exit 0
          flags=()
          [[ "${DRAFT}" == true ]] && flags+=(--draft)
          [[ "${PRERELEASE}" == true ]] && flags+=(--prerelease)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" "${flags[@]}" --title "Folio ${TAG}"
          else
            gh release create "${TAG}" --generate-notes --title "Folio ${TAG}" "${flags[@]}"
          fi

  build-linux:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Build natively: cross-compiling WebKitGTK bundles is not a supported release path.
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    container: ghcr.io/liminal-hq/tauri-ci-desktop:latest
    env:
      # The public key is committed in Tauri config; only CI receives the signing half of the pair.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FOLIO_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FOLIO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run release:version:check
      # `tauri:bundle` builds `folio-mcp` for this machine and bundles it beside the app, which is
      # where Connect an agent looks for it.
      - run: bun run --cwd apps/folio tauri:bundle --bundles deb,rpm
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-assets/linux/ \;
          find target/release/bundle -type f \( -name '*.deb.sig' -o -name '*.rpm.sig' \) -exec cp {} release-assets/linux/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets-${{ matrix.arch }}
          path: release-assets/linux/*
          if-no-files-found: error

  package-appimage:
    name: AppImage (${{ matrix.arch }})
    needs: [prepare, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            deb-artifact: linux-release-assets-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb-artifact: linux-release-assets-arm64
    uses: liminal-hq/.github/.github/workflows/package-arch-appimage.yml@main
    with:
      runs-on: ${{ matrix.runner }}
      deb-artifact-name: ${{ matrix.deb-artifact }}
      app-version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  build-windows:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Windows installers must be built on their target architecture for a supported updater payload.
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FOLIO_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FOLIO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run release:version:check
        shell: bash
      - run: bun run --cwd apps/folio tauri:bundle --bundles msi,nsis
        shell: bash
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/windows
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.msi.sig' -o -name '*.exe.sig' \) -exec cp {} release-assets/windows/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets-${{ matrix.arch }}
          path: release-assets/windows/*
          if-no-files-found: error

  build-mcp:
    name: folio-mcp (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            file: folio-mcp
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            file: folio-mcp
          - runner: windows-latest
            platform: win32-x64
            target: x86_64-pc-windows-msvc
            file: folio-mcp.exe
          - runner: windows-11-arm
            platform: win32-arm64
            target: aarch64-pc-windows-msvc
            file: folio-mcp.exe
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release --locked -p folio-mcp --target ${{ matrix.target }}
      - name: Name the binary for its platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mcp-binaries
          ext=""
          [[ "${{ matrix.file }}" == *.exe ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "mcp-binaries/folio-mcp-${{ matrix.platform }}${ext}"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-binary-${{ matrix.platform }}
          path: mcp-binaries/*
          if-no-files-found: error

  package-mcp:
    name: npm packages and Claude Desktop bundle
    needs: [prepare, build-mcp]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: 'mcp-binary-*'
          path: mcp-binaries
          merge-multiple: true
      - run: bash scripts/package-mcp.sh "${{ needs.prepare.outputs.version }}" mcp-binaries mcp-packages
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack mcp-packages/mcpb "mcp-packages/folio-${{ needs.prepare.outputs.version }}.mcpb"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-packages
          path: |
            mcp-packages/npm/*.tgz
            mcp-packages/*.mcpb
          if-no-files-found: error

  publish:
    needs: [prepare, build-linux, package-appimage, build-windows, package-mcp]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # Each native matrix job supplies one architecture-specific directory.
          pattern: 'linux-release-assets-*'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: 'appimage-*'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: 'windows-release-assets-*'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: mcp-packages
          path: release-assets
      # The updater reads `latest.json` from the latest release; it lists the installers that have a
      # signature (see `scripts/make-update-manifest.sh`).
      - run: bash scripts/make-update-manifest.sh release-assets "${{ needs.prepare.outputs.tag }}" "${{ github.repository }}"
      - run: (cd release-assets && sha256sum ./* > SHA256SUMS)
      # A dry run publishes nothing, so keep what it staged to look at.
      - if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staged-release-assets
          path: release-assets/*
          if-no-files-found: error
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          [[ "${DRY_RUN}" == true ]] && exit 0
          gh release upload "${TAG}" release-assets/* --clobber

  # Opt in with the repository variable PUBLISH_MCP_TO_NPM=true and an NPM_TOKEN secret. The platform
  # packages go first so the launcher's dependencies exist when it is published.
  publish-npm:
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.draft != 'true' && vars.PUBLISH_MCP_TO_NPM == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-packages
          path: mcp-packages
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag=latest
          [[ "${PRERELEASE}" == true ]] && tag=next
          for f in mcp-packages/npm/*-linux-*.tgz mcp-packages/npm/*-win32-*.tgz mcp-packages/npm/liminal-hq-folio-mcp-[0-9]*.tgz; do
            npm publish "$f" --access public --tag "$tag"
          done
