<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Folio</title>
  <desc id="hero-desc">Books, laid out by hand, without the hard parts. An animated banner shows a picture frame and a text frame being dragged across an open picture-book spread, snapping to cyan smart guides, with the pink bleed line and purple margins appearing before the page turns.</desc>

  <style>
    .display { font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .ui { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0d12"/>
      <stop offset="100%" stop-color="#1d1218"/>
    </linearGradient>

    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7e2ba"/>
      <stop offset="45%" stop-color="#f19b18"/>
      <stop offset="100%" stop-color="#cf5d22"/>
    </linearGradient>

    <linearGradient id="spine" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d3147"/>
      <stop offset="0.55" stop-color="#cf5d22"/>
      <stop offset="1" stop-color="#f19b18"/>
    </linearGradient>

    <radialGradient id="slit-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f7e2ba" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f19b18" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f19b18" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="cursor-shadow" x="-50%" y="-50%" width="220%" height="220%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="frame-clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Ambient glows -->
    <g opacity="0.12">
      <circle cx="900" cy="170" r="220" fill="#cf5d22"/>
      <circle cx="120" cy="40" r="160" fill="#5d3147"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(64, 0)">
      <text class="display" x="0" y="140" font-size="82" font-weight="700" letter-spacing="-2" fill="url(#ember)" filter="url(#glow)">Folio</text>
      <text class="display" x="2" y="184" font-size="22" font-weight="500" fill="#f5efe9">Books, laid out by hand, without the hard parts</text>
      <text class="ui" x="2" y="214" font-size="15" fill="#a99fb0">Picture books · memoirs · cookbooks · poetry — to Kindle, Kobo and print</text>

      <!-- Chips -->
      <g class="ui" font-size="12.5" font-weight="600" fill="#f5efe9">
        <rect x="2" y="238" width="86" height="26" rx="13" fill="#241c24" stroke="#42343f"/>
        <text x="45" y="255.5" text-anchor="middle">Tauri v2</text>
        <rect x="98" y="238" width="70" height="26" rx="13" fill="#241c24" stroke="#42343f"/>
        <text x="133" y="255.5" text-anchor="middle">React</text>
        <rect x="178" y="238" width="62" height="26" rx="13" fill="#241c24" stroke="#42343f"/>
        <text x="209" y="255.5" text-anchor="middle">Rust</text>
        <rect x="250" y="238" width="132" height="26" rx="13" fill="#241c24" stroke="#42343f"/>
        <text x="316" y="255.5" text-anchor="middle">Linux · Windows 11</text>
      </g>
    </g>

    <!-- The spread -->
    <g transform="translate(590, 36)" filter="url(#paper-shadow)">
      <!-- Glow behind the gutter -->
      <ellipse cx="240" cy="124" rx="120" ry="150" fill="url(#slit-glow)"/>

      <!-- Left and right pages -->
      <rect x="0" y="0" width="240" height="248" rx="4" fill="#fbfaf6"/>
      <rect x="240" y="0" width="240" height="248" rx="4" fill="#f6f4ee"/>
      <rect x="236" y="0" width="8" height="248" fill="#1c1b20" opacity="0.1"/>

      <!-- Margins (purple dashes), faded in by the animation -->
      <g fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 4" opacity="0.55">
        <rect x="18" y="18" width="204" height="212"/>
        <rect x="258" y="18" width="204" height="212"/>
      </g>

      <!-- Static copy on the right page -->
      <g fill="#1c1b20" opacity="0.55">
        <rect x="280" y="150" width="150" height="5" rx="2.5"/>
        <rect x="280" y="164" width="164" height="5" rx="2.5"/>
        <rect x="280" y="178" width="120" height="5" rx="2.5"/>
      </g>
      <rect x="280" y="40" width="160" height="96" rx="4" fill="#cf5d22" opacity="0.2"/>
      <path d="M284 128l34-30 26 22 22-18 70 26z" fill="#cf5d22" opacity="0.5"/>
      <circle cx="404" cy="70" r="9" fill="#f19b18" opacity="0.75"/>

      <!-- Picture frame being dragged on the left page -->
      <g>
        <rect x="30" y="40" width="180" height="110" rx="4" fill="#5d3147" opacity="0.88"/>
        <path d="M34 140l50-48 36 30 30-24 60 42z" fill="#f19b18" opacity="0.55"/>
        <circle cx="168" cy="68" r="11" fill="#f7e2ba" opacity="0.9"/>
        <rect x="30" y="40" width="180" height="110" rx="4" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
        <animateTransform class="motion" attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
          values="-14 14;-14 14;0 0;0 0;-14 14" keyTimes="0;0.08;0.3;0.8;1" calcMode="spline"
          keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
      </g>

      <!-- Text frame being dragged below it -->
      <g>
        <rect x="30" y="168" width="180" height="50" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="2 3"/>
        <g fill="#1c1b20" opacity="0.7">
          <rect x="38" y="178" width="150" height="5" rx="2.5"/>
          <rect x="38" y="191" width="164" height="5" rx="2.5"/>
          <rect x="38" y="204" width="96" height="5" rx="2.5"/>
        </g>
        <animateTransform class="motion" attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
          values="18 -10;18 -10;0 0;0 0;18 -10" keyTimes="0;0.12;0.34;0.8;1" calcMode="spline"
          keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
      </g>

      <!-- Smart guides that flash on snap -->
      <g class="motion" stroke="#22d3ee" stroke-width="1" opacity="0">
        <line x1="30" y1="-6" x2="30" y2="254"/>
        <line x1="-6" y1="40" x2="486" y2="40"/>
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
          values="0;0;1;1;0;0" keyTimes="0;0.28;0.3;0.4;0.44;1"/>
      </g>

      <!-- Bleed line (pink dashes) around the whole spread -->
      <rect class="motion" x="-9" y="-9" width="498" height="266" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="5 4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
          values="0;0;0.8;0.8;0;0" keyTimes="0;0.4;0.48;0.7;0.76;1"/>
      </rect>

      <!-- Page turn -->
      <g class="motion">
        <path d="M480 0h0v248h0z" fill="#fbfaf6" opacity="0">
          <animate attributeName="d" dur="9s" repeatCount="indefinite"
            values="M480 0L480 0L480 248L480 248Z;M480 0L480 0L480 248L480 248Z;M480 0L330 18L330 230L480 248Z;M480 0L242 4L242 244L480 248Z;M480 0L480 0L480 248L480 248Z"
            keyTimes="0;0.8;0.88;0.95;1"/>
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
            values="0;0;0.95;0.95;0" keyTimes="0;0.8;0.82;0.97;1"/>
        </path>
      </g>

      <!-- Pointer -->
      <g class="motion" filter="url(#cursor-shadow)">
        <path d="M0 0l0 16l4.6-4.2l3 6.6l2.4-1.1l-3-6.4l6.4-.3z" fill="#ffffff" stroke="#1c1b20" stroke-width="0.9" stroke-linejoin="round"/>
        <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
          values="70 90;70 90;120 100;120 100;70 190;70 190;70 90" keyTimes="0;0.08;0.3;0.34;0.5;0.8;1" calcMode="linear"/>
      </g>
    </g>

    <!-- Open-spread mark, echoing the app icon -->
    <g transform="translate(1108, 32) scale(1.3)" opacity="0.95">
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#0e0d12" stroke="#42343f"/>
      <path d="M28.5 19C22 16.5 16 17 12.5 19V45.5C16 43.5 22 43 28.5 45.5" fill="none" stroke="url(#spine)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M35.5 19C42 16.5 48 17 51.5 19V45.5C48 43.5 42 43 35.5 45.5" fill="none" stroke="url(#spine)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 22V44" stroke="#f7e2ba" stroke-opacity="0.85" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
